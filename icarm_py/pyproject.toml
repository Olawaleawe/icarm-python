[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icarm"
version = "0.1.0"
description = "Interpretable, Contextual-Accountable and Responsible Machine Learning"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Olushina Olawale Awe", email = "olawaleawe@gmail.com" }
]
keywords = [
    "machine learning", "interpretable", "fairness",
    "responsible AI", "SHAP", "ALE", "accountability"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[project.optional-dependencies]
extended = [
    "xgboost>=1.7",
    "lightgbm>=3.3",
    "pygam>=0.8",
    "shap>=0.42",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
all = ["icarm[extended,dev]"]

[project.urls]
Homepage     = "https://github.com/Olawaleawe/icarm-python"
Repository   = "https://github.com/Olawaleawe/icarm-python"
"Bug Tracker" = "https://github.com/Olawaleawe/icarm-python/issues"
"R package"  = "https://CRAN.R-project.org/package=icarm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"

[tool.ruff]
line-length = 88
target-version = "py39"
